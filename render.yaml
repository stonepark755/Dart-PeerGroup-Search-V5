services:
  - type: web
    name: dart-agent
    runtime: docker
    plan: free
    envVars:
      # 클라우드(데이터센터) IP에서는 KRX·DART 웹페이지 스크래핑(web)이 403으로 차단됨.
      # 서버 배포에서는 공식 OpenDART API 모드를 사용한다(인증키 필요).
      - key: DATA_SOURCE
        value: api
      - key: DART_API_KEY      # OpenDART 인증키 40자리 (https://opendart.fss.or.kr 무료 발급, Render 대시보드에서 값 입력)
        sync: false
      - key: APP_PASSWORD      # 공개 URL 보호용 비밀번호 (Render 대시보드에서 값 입력)
        sync: false
